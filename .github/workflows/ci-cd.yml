name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t ghcr.io/rahafabualrub/secure-task-manager-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push ghcr.io/rahafabualrub/secure-task-manager-backend:latest

      - name: Build frontend image
        run: |
          docker build \
            -t ghcr.io/rahafabualrub/secure-task-manager-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push ghcr.io/rahafabualrub/secure-task-manager-frontend:latest
