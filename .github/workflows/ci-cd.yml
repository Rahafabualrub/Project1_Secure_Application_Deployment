```yaml
name: CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: self-hosted

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build --platform linux/amd64 \
            -t ghcr.io/rahafabualrub/secure-task-manager-backend:latest \
            ./backend

      - name: Push backend image
        run: |
          docker push --platform linux/amd64 \
            ghcr.io/rahafabualrub/secure-task-manager-backend:latest

      - name: Build frontend image
        run: |
          docker build --platform linux/amd64 \
            -t ghcr.io/rahafabualrub/secure-task-manager-frontend:latest \
            ./frontend

      - name: Push frontend image
        run: |
          docker push --platform linux/amd64 \
            ghcr.io/rahafabualrub/secure-task-manager-frontend:latest

  deploy:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - name: Deploy application
        run: |
          cd ~/Desktop/finalProject3/Project1_Secure_Application_Deployment
          ./vault/vault-script.sh

      - name: Verify deployment
        run: |
          cd ~/Desktop/finalProject3/Project1_Secure_Application_Deployment
          docker compose ps
```
